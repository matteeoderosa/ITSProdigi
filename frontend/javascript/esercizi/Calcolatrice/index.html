<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>calcolatrice</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="calculator">
            <input type="text" id="result" disabled />
            <div class="buttons">
                <button onclick="esegui('7')">7</button>
                <button onclick="esegui('8')">8</button>
                <button onclick="esegui('9')">9</button>
                <button onclick="esegui('/')" class="operators">÷</button>
                <button onclick="esegui('4')">4</button>
                <button onclick="esegui('5')">5</button>
                <button onclick="esegui('6')">6</button>
                <button onclick="esegui('*')" class="operators">x</button>
                <button onclick="esegui('1')">1</button>
                <button onclick="esegui('2')">2</button>
                <button onclick="esegui('3')">3</button>
                <button onclick="esegui('-')" class="operators">-</button>
                <button onclick="esegui('0')">0</button>
                <button onclick="esegui('.')" id="punto">.</button>
                <button onclick="esegui('+')" class="operators">+</button>
                <button onclick="esegui('=')" class="equal">=</button>
                <button onclick="esegui('C')" class="clear">C</button>
                <button onclick="esegui('%')" class="operators">%</button>
            </div>
        </div>
    </body>
</html>
