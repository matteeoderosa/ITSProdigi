<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somma con Doppio Bottone</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>

    <h1>Lista di numeri con doppio bottone + somma</h1>
    <p>
        Questo programma aggiunge i numeri inseriti in una lista e aggiorna la somma.
        <br>
        Quando un numero viene premuto lo rimuove (aggiornando la somma).
        <br>
        Quando viene premuto il tasto apposito, resetta la lista e riporta la somma a 0.
    </p>

    <br>
    
    <input type="number" id="numero" placeholder="Numero">
    <br><br>
    <button id="aggiungi">Aggiungi</button>
    <br><br>
    <button id="svuota">Svuota</button>
    <br><br>

    <ul id="lista"></ul>
    <p id="somma"></p>

</body>
</html>
