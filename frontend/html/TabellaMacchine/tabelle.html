    <h1>Le tabelle in HTML</h1>
    <h2>Una prima tabella di esempio</h2>
    <table border="1">
        <tr>
            <th id="venditeauto">Vendite auto</th>
            <th scope="col" class="mese">Gennaio</th>
            <th scope="col" class="mese">Febbraio</th>
            <th scope="col" class="mese">Marzo</th>
        </tr>
        <tr>
            <th scope="row" class="auto">Fiat Panda</th>
            <td>121</td>
            <td>119</td>
            <td>123</td>
        </tr>
        <tr>
            <th scope="row" class="auto">Opel Zafira</th>
            <td>89</td>
            <td>80</td>
            <td>70</td>
        </tr>
        <tr>
            <th scope="row" class="auto">Audi A4</th>
            <td>10</td>
            <td>12</td>
            <td>14</td>
        </tr>
    </table>
</body>
