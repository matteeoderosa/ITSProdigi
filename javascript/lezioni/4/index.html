<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settimana</title>
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <h1>Calcolo giorno della settimana</h1>
    <p>Questo programmino calcola il giorno della settimana in base al numero inserito</p>
    <ol>
        <li><i>Lunedi</i></li>
        <li><i>Martedi</i></li>
        <li><i>Mercoledi</i></li>
        <li><i>Giovedi</i></li>
        <li><i>Venerdi</i></li>
        <li><i>Sabato</i></li>
        <li><i>Domenica</i></li>
    </ol>

    <input type="number" id="numero" placeholder="giorno della settimana">
    <input type="button" value="invio" onclick="inizio()">

    <div id="soluzione"></div>

</body>

</html>
