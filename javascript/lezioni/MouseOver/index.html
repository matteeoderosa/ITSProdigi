<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Over</title>

    <script src="./script.js" defer></script>

</head>

<body>
    <h1>Attributo Mouse Over</h1>

    <p>Questo esercizio cambia il testo del paragrafo passando il mouse sopra l'immagine</p>

    <img src="./foto/Latte.jpg" width="100" alt="Prima immagine" onmouseover=" changeText(0)" onmouseout=" changeText(1)">

    <p id="paragraph">testo default del paragrafo</p>

</body>

</html>
