<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Over</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>

</head>

<body>
    <h1>Attributo Mouse Over</h1>

    <p>Questo esercizio cambia il testo del paragrafo passando il mouse sopra il box</p>

    <div onmouseover=" changeText(0)" onmouseout=" changeText(1)">passa qui il mouse</div>

    <p id="paragraph">testo default del paragrafo</p>

</body>

</html>
