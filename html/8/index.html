<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrazione</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Registrazione</h1>

    <!--
      Opzione A (consigliata per demo): invio gestito in JavaScript (vedi script sotto).
      Opzione B: invio a backend:
        - metti action="/register" e lascia method="POST"
        - rimuovi preventDefault nello script
    -->
    <form id="signupForm" action="process.php" method="POST" novalidate>
      <div class="field">
        <label for="nome">Nome</label>
        <input
          id="nome"
          name="nome"
          type="text"
          placeholder="Nome"
          autocomplete="given-name"
          required
          minlength="2"
        />
      </div>

      <div class="field">
        <label for="cognome">Cognome</label>
        <input
          id="cognome"
          name="cognome"
          type="text"
          placeholder="Cognome"
          autocomplete="family-name"
          required
          minlength="2"
        />
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Username"
          autocomplete="username"
          required
          minlength="3"
          pattern="[A-Za-z0-9_\.]{3,}"
          title="Usa almeno 3 caratteri: lettere, numeri, _ o ."
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
          required
          minlength="8"
        />
        <small class="hint">Minimo 8 caratteri.</small>
      </div>

      <button type="submit">Invia</button>

      <p id="formMsg" class="msg" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("signupForm");
    const msg = document.getElementById("formMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // Togli questa riga se vuoi usare form action=...

      msg.textContent = "";

      // Validazione HTML5
      if (!form.checkValidity()) {
        msg.textContent = "Controlla i campi: alcuni valori non sono validi.";
        form.reportValidity();
        return;
      }

      // Raccolta dati
      const data = Object.fromEntries(new FormData(form).entries());

      // DEMO: mostra cosa invieresti (non stampare la password in un progetto reale)
      console.log("Dati form:", { ...data, password: "********" });

      // Se hai un backend, invia così:
      // try {
      //   const res = await fetch("/register", {
      //     method: "POST",
      //     headers: { "Content-Type": "application/json" },
      //     body: JSON.stringify(data),
      //   });
      //   if (!res.ok) throw new Error("Errore server");
      //   msg.textContent = "Registrazione inviata con successo.";
      //   form.reset();
      // } catch (err) {
      //   msg.textContent = "Invio fallito. Riprova.";
      // }

      msg.textContent = "OK (demo): dati raccolti in console.";
      form.reset();
    });
  </script>
</body>
</html>
